<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ORION AR — Compilar imagem-alvo</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071426;color:#fff;margin:0;padding:24px}
    main{max-width:720px;margin:auto;background:#10233b;border-radius:20px;padding:24px}
    h1{margin-top:0}.drop{border:2px dashed #6bb7ff;border-radius:16px;padding:28px;text-align:center;margin:20px 0}
    button{border:0;border-radius:12px;padding:13px 18px;background:#1677ff;color:#fff;font-weight:800}
    progress{width:100%;margin-top:18px}.muted{color:#b7c9dc}
  </style>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
</head>
<body>
<main>
  <h1>ORION AR — Target Compiler</h1>
  <p class="muted">Selecione a imagem que será reconhecida pela câmera. Para este projeto, use <b>assets/target.jpg</b>.</p>
  <div class="drop">
    <input id="files" type="file" accept="image/jpeg,image/png">
    <p><button id="compile">COMPILAR TARGET</button></p>
    <progress id="progress" value="0" max="100"></progress>
    <p id="msg" class="muted"></p>
  </div>
</main>
<script>
const input=document.getElementById('files');
const button=document.getElementById('compile');
const progress=document.getElementById('progress');
const msg=document.getElementById('msg');

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}

button.addEventListener('click', async()=>{
  const file=input.files[0];
  if(!file){msg.textContent='Selecione target.jpg primeiro.';return;}
  button.disabled=true; msg.textContent='Preparando imagem…'; progress.value=0;
  try{
    const image=await loadImage(file);
    const compiler=new window.MINDAR.IMAGE.Compiler();
    await compiler.compileImageTargets([image], p=>{
      progress.value=Math.round(p*100);
      msg.textContent=`Compilando: ${Math.round(p*100)}%`;
    });
    const buffer=await compiler.exportData();
    const blob=new Blob([buffer],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='targets.mind'; a.click();
    URL.revokeObjectURL(url);
    msg.textContent='Pronto. Coloque targets.mind na mesma pasta de index.html.';
  }catch(e){
    console.error(e); msg.textContent='Não foi possível compilar. Tente o compilador online do MindAR.';
  }finally{button.disabled=false;}
});
</script>
</body>
</html>
